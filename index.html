<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="description" content="Nosso checklist das 64 melhores cafeterias de Porto Alegre.">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='11' fill='%23FBEFE7'/><path d='M12 18h20v9a9 9 0 0 1-9 9h-2a9 9 0 0 1-9-9V18Z' fill='%23FFFAF6' stroke='%232B1D17' stroke-width='2.4'/><path d='M32 21h3a4 4 0 0 1 0 8h-3' fill='none' stroke='%232B1D17' stroke-width='2.4'/><path d='M18 12c0-2 2-2 2-3M24 12c0-2 2-2 2-3M30 12c0-2 2-2 2-3' stroke='%23DD5C41' stroke-width='2.2' fill='none' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBEFE7; --paper2:#FFFAF6; --ink:#2B1D17; --ink60:#7B655B;
  --red:#DD5C41; --green:#3E8072; --gold:#E39B34; --pink:#F6D6CC; --line:#2B1D17;
  --sh:3px 3px 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"DM Sans","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:none;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4;
  background-image:radial-gradient(var(--ink) .5px,transparent .5px);
  background-size:22px 22px;
}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 18px 40px}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}

/* ---------- topo ---------- */
.top{padding:26px 0 14px}
.brandrow{display:flex;align-items:center;gap:12px}
.cup{width:42px;height:42px;flex:none}
.brand{font-size:26px;line-height:1}
.brand small{display:block;font-family:inherit;font-weight:500;font-size:11.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink60);margin-top:5px}

.meter{margin-top:18px;border:2px solid var(--line);border-radius:16px;
  background:linear-gradient(160deg,var(--paper2),#FCE6E0);
  box-shadow:var(--sh);padding:14px 16px}
.meter .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pct{font-family:"Bricolage Grotesque","Segoe UI",system-ui,Helvetica,sans-serif;font-weight:800;font-size:34px;line-height:.9}
.pctlab{font-size:12.5px;color:var(--ink60);font-weight:500}
.bar{margin-top:11px;height:13px;border:2px solid var(--line);border-radius:99px;background:#fff;
  overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;border-radius:99px;
  background:repeating-linear-gradient(45deg,var(--red) 0 7px,#C64A31 7px 14px);
  transition:width .7s cubic-bezier(.2,.9,.25,1)}
.beans{margin-top:9px;font-size:12px;color:var(--ink60);display:flex;justify-content:space-between}

/* ---------- busca / abas ---------- */
.search{margin:16px 0 4px;position:relative}
.search input{width:100%;font:inherit;font-size:15px;padding:12px 14px 12px 40px;border:2px solid var(--line);
  border-radius:13px;background:var(--paper2);color:var(--ink);outline:none}
.search input::placeholder{color:#A08C82}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.tabs{display:flex;gap:8px;margin:12px 0 6px;flex-wrap:wrap}
.tab{font:inherit;font-size:12.5px;font-weight:700;padding:7px 13px;border:2px solid var(--line);
  border-radius:99px;background:transparent;color:var(--ink);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- lista de bairros ---------- */
.sechead{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sechead h2{font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.sechead .ln{flex:1;height:2px;background:var(--ink);opacity:.16}

.hood{width:100%;display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer;
  background:var(--paper2);border:2px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:10px;
  box-shadow:var(--sh);transition:transform .12s,box-shadow .12s;font:inherit;color:inherit}
.hood:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.hood .ic{width:38px;height:38px;flex:none;border:2px solid var(--line);border-radius:11px;
  display:grid;place-items:center;background:var(--pink);font-size:18px}
.hood .nm{flex:1;min-width:0}
.hood .nm b{font-family:"Bricolage Grotesque","Segoe UI",system-ui,Helvetica,sans-serif;font-weight:700;font-size:16px;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hood .nm span{font-size:12px;color:var(--ink60)}
.dots{display:flex;gap:3px;flex-wrap:wrap;max-width:76px;justify-content:flex-end}
.dots i{width:6px;height:6px;border-radius:99px;border:1.5px solid var(--ink);background:transparent}
.dots i.on{background:var(--green);border-color:var(--green)}
.hood.done{background:#E7F1EC;border-color:var(--green)}
.hood.done .ic{border-color:var(--green);background:#CFE7DE}

/* ---------- cards ---------- */
.card{position:relative;border:2px solid var(--line);border-radius:17px;background:var(--paper2);
  box-shadow:var(--sh);overflow:hidden;margin-bottom:14px}
.card .ph{position:relative;height:170px;background:#EADFD4;overflow:hidden}
.card .ph img.shot{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.card .ph .fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:52px;
  background:linear-gradient(135deg,#F3E2D3,#E7C9B4);
  box-shadow:inset 0 0 0 1px rgba(36,24,19,.07)}
.addphoto{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;
  display:flex;align-items:center;gap:7px;background:var(--paper2);border:2px solid var(--line);
  border-radius:12px;padding:9px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;
  box-shadow:var(--sh);z-index:2;color:var(--ink)}
.addphoto:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.badge{position:absolute;top:10px;left:10px;background:var(--paper2);border:2px solid var(--line);
  border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:700;display:flex;gap:4px;align-items:center;z-index:2}
.card .bd{padding:13px 14px 14px}
.card h3{font-size:17.5px;line-height:1.2}
.card .sub{font-size:12.5px;color:var(--ink60);margin:5px 0 0}
.card .tip{font-size:13px;margin:9px 0 0;padding-left:11px;border-left:3px solid var(--gold);line-height:1.45}
.metaline:not(:empty){margin-top:11px}
.vdate{font-size:12px;color:var(--green);font-weight:700}
.rate{display:flex;align-items:center;gap:9px;margin-top:7px;flex-wrap:wrap}
.rate .lab{font-size:12px;color:var(--ink60);font-weight:600}
.stars{display:inline-flex;gap:2px}
.stars button{font:inherit;font-size:20px;line-height:1;background:none;border:none;padding:0 1px;cursor:pointer;color:#DBC7BA}
.stars button.on{color:var(--gold)}
.acts{display:flex;gap:9px;margin-top:13px}
.btn{flex:1;font:inherit;font-weight:700;font-size:13.5px;padding:11px 10px;border:2px solid var(--line);
  border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--paper);color:var(--ink);text-decoration:none;transition:transform .1s}
.btn:active{transform:translateY(2px)}
.btn.main{background:var(--red);color:#fff;border-color:var(--line)}
.card.done{border-color:var(--green);background:#EFF6F3}
.card.done .btn.main{background:var(--green)}

/* carimbo */
.stamp{position:absolute;top:50%;left:50%;width:132px;height:132px;pointer-events:none;
  transform:translate(-50%,-50%) rotate(-16deg) scale(.3);opacity:0;transition:none;z-index:3}
.card.done .stamp{opacity:1;transform:translate(-50%,-50%) rotate(-16deg) scale(1)}
.card.pop .stamp{animation:stampIn .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stampIn{0%{opacity:0;transform:translate(-50%,-50%) rotate(-42deg) scale(2.1)}
  60%{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(.88)}
  100%{opacity:1;transform:translate(-50%,-50%) rotate(-16deg) scale(1)}}
.card.pop{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-6px)}44%{transform:translateX(5px)}70%{transform:translateX(-2px)}}
.card.done .ph .fallback{background:linear-gradient(135deg,#DCEAE3,#C6DfD6)}

/* ---------- álbum ---------- */
.album{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:6px}
.tile{border:2px solid var(--line);border-radius:15px;overflow:hidden;background:var(--paper2);
  box-shadow:var(--sh);cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;display:block}
.tile:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tile .tph{height:132px;background:#EADFD4}
.tile .tph img{width:100%;height:100%;object-fit:cover;display:block}
.tile .tb{padding:8px 10px 10px}
.tile .tb b{font-family:"Bricolage Grotesque",sans-serif;font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tb span{font-size:11.5px;color:var(--ink60)}

/* ---------- nav / voltar ---------- */
.back{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13.5px;background:none;
  border:none;color:var(--ink);cursor:pointer;padding:16px 0 6px;font-family:inherit}
.hoodhead{margin:2px 0 16px}
.hoodhead h2{font-size:27px;line-height:1.05}
.hoodhead p{margin:7px 0 0;font-size:13px;color:var(--ink60)}

.empty{text-align:center;padding:48px 16px;color:var(--ink60);font-size:14px}
.empty div{font-size:40px;margin-bottom:10px}

/* rodapé */
.foot{margin-top:34px;padding-top:18px;border-top:2px dashed rgba(43,29,23,.25);
  display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.foot button{font:inherit;font-size:12px;font-weight:700;background:none;border:2px solid rgba(43,29,23,.3);
  border-radius:99px;padding:7px 14px;color:var(--ink60);cursor:pointer}
.foot button.hi{border-color:var(--ink);color:var(--ink);background:var(--pink)}
.mini{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--paper2);
  border-bottom:2px solid var(--ink);padding:9px 16px calc(9px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:11px;transform:translateY(-105%);transition:transform .3s}
.mini.on{transform:none}
.mini .mb{flex:1;height:9px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.mini .mb i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .5s}
.mini b{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;font-size:13.5px}
.tipbox{border:2px dashed rgba(43,29,23,.4);border-radius:14px;padding:12px 15px;margin:16px 0 2px;
  font-size:13px;line-height:1.5;color:var(--ink60);background:rgba(255,255,255,.5)}
.tipbox b{color:var(--ink)}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:120;background:rgba(30,18,12,.88);display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:15px}
.lb.on{display:flex}
.lb img{max-width:92vw;max-height:62vh;border:3px solid var(--paper2);border-radius:14px;object-fit:contain;background:#000}
.lb .cap{color:var(--paper);text-align:center}
.lb .cap b{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;display:block}
.lb .cap span{font-size:13px;opacity:.85}
.lbacts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lbacts button{font:inherit;font-weight:700;font-size:13.5px;padding:11px 16px;border:2px solid var(--paper2);
  border-radius:12px;background:transparent;color:var(--paper);cursor:pointer}
.lbacts button.danger{background:var(--red);border-color:var(--red)}
.lbacts button.close{background:var(--paper2);color:var(--ink)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,120%);background:var(--ink);color:var(--paper);
  padding:12px 20px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:140;transition:transform .35s cubic-bezier(.2,1.2,.3,1);
  max-width:88vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div>

<div class="toast" id="toast"></div>

/* ================= IndexedDB (fotos) ================= */
const DB="rota-cafe", STORE="fotos";
let dbp;
function db(){
  if(dbp) return dbp;
  dbp=new Promise((res,rej)=>{
    let r; try{ r=indexedDB.open(DB,1); }catch(e){ return rej(e); }
    r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:"id"}); };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
  return dbp;
}
const store = mode => db().then(d=>d.transaction(STORE,mode).objectStore(STORE));
const idbGet = id => store("readonly").then(s=>new Promise((res,rej)=>{const r=s.get(id);r.onsuccess=()=>res(r.result?r.result.blob:null);r.onerror=()=>rej(r.error);}));
const idbPut = (id,blob,criadaEm) => store("readwrite").then(s=>new Promise((res,rej)=>{const r=s.put({id,blob,criadaEm:criadaEm||Date.now()});r.onsuccess=()=>res();r.onerror=()=>rej(r.error);}));
const idbDelete = id => store("readwrite").then(s=>new Promise((res,rej)=>{const r=s.delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);}));
const idbAll = () => store("readonly").then(s=>new Promise((res,rej)=>{const r=s.getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}));

/* pede ao navegador para NÃO descartar os dados automaticamente */
async function ensurePersist(){
  try{
    if(navigator.storage && navigator.storage.persist){
      if(await navigator.storage.persisted()) return true;
      return await navigator.storage.persist();
    }
  }catch(_){}
  return false;
}

/* ================= compressão de imagem ================= */
async function loadBitmap(file){
  if(window.createImageBitmap){
    try{ return {bmp:await createImageBitmap(file,{imageOrientation:"from-image"}),isImg:false}; }
    catch(_){ try{ return {bmp:await createImageBitmap(file),isImg:false}; }catch(__){} }
  }
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url;});
    return {bmp:img,isImg:true,url};
  }catch(e){ URL.revokeObjectURL(url); throw e; }
}
async function compress(file){
  const {bmp,isImg,url}=await loadBitmap(file);
  const iw=bmp.width||bmp.naturalWidth, ih=bmp.height||bmp.naturalHeight;
  const scale=Math.min(1,1200/Math.max(iw,ih));
  const w=Math.max(1,Math.round(iw*scale)), h=Math.max(1,Math.round(ih*scale));
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(bmp,0,0,w,h);
  if(!isImg && bmp.close) bmp.close();
  if(isImg && url) URL.revokeObjectURL(url);
  let blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.8));
  if(!blob) blob=await new Promise(r=>cv.toBlob(r));
  return blob||file;
}
const blobToDataURL = b => new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b);});
const dataURLToBlob = async d => (await fetch(d)).blob();

/* ================= progresso ================= */
function refreshMeter(){
  const t=CAFES.length, d=done.size, p=Math.round(d/t*100);
  $("#pct").textContent=p+"%"; $("#cnt").textContent=d+"/"+t; $("#bar").style.width=p+"%";
  const hd=BAIRROS.filter(b=>CAFES.filter(c=>c.b===b).every(c=>done.has(c.id))).length;
  $("#hoodsdone").textContent = hd?`${hd} bairro${hd>1?"s":""} completo${hd>1?"s":""}`:"";
  $("#miniN").textContent=d+"/"+t; $("#miniB").style.width=p+"%";
  $("#msg").textContent =
    d===0?"Bora começar? ☕" : d===t?"Rota completa! 🏆" :
    p<25?"Aquecendo a xícara…" : p<50?"Tá pegando o ritmo!" :
    p<75?"Mais da metade, isso!" : "Falta pouco pro final!";
}

/* ================= telas ================= */
function screenHome(){
  const q=state.q.toLowerCase().trim();
  if(q) return screenBusca(q);
  const cards = BAIRROS.map(b=>{
    const list=CAFES.filter(c=>c.b===b), d=list.filter(c=>done.has(c.id)).length;
    const full = d===list.length;
    return `<button class="hood ${full?'done':''}" data-hood="${esc(b)}">
      <span class="ic">${full?"✓":hoodIcon(b)}</span>
      <span class="nm"><b>${esc(b)}</b><span>${d} de ${list.length} visitada${list.length>1?'s':''}</span></span>
      <span class="dots">${list.map(c=>`<i class="${done.has(c.id)?'on':''}"></i>`).join("")}</span>
    </button>`;
  }).join("");
  return `${searchBar()}
    <div class="sechead"><h2>Escolha um bairro</h2><span class="ln"></span></div>
    ${cards}`;
}
function screenBusca(q){
  const hits=CAFES.filter(c=>(c.n+" "+c.b+" "+c.d).toLowerCase().includes(q));
  return `${searchBar()}
    <div class="sechead"><h2>${hits.length} resultado${hits.length!==1?'s':''}</h2><span class="ln"></span></div>
    ${hits.length?hits.map(cardHTML).join(""):emptyHTML("Nada com esse nome por aqui.")}`;
}
function screenHood(){
  const list=CAFES.filter(c=>c.b===state.hood).sort((a,b)=>b.r-a.r);
  const d=list.filter(c=>done.has(c.id)).length;
  const f=state.filter;
  const shown=list.filter(c=> f==="todas"||(f==="faltam"?!done.has(c.id):done.has(c.id)));
  return `<button class="back" id="back">← Todos os bairros</button>
    <div class="hoodhead">
      <h2>${esc(state.hood)}</h2>
      <p>${d} de ${list.length} já visitada${list.length>1?'s':''} ${d===list.length?"— bairro completo 🎉":""}</p>
    </div>
    <div class="tabs">
      ${["todas","faltam","visitadas"].map(t=>
        `<button class="tab" data-f="${t}" aria-pressed="${f===t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}
    </div>
    ${shown.length?shown.map(cardHTML).join(""):emptyHTML(f==="faltam"?"Tudo visitado nesse bairro! 🎉":"Nenhuma marcada ainda.")}`;
}

  return `<button class="back" id="back">← Voltar</button>

function metaLineHTML(id){

}

/* ================= render ================= */
function render(keepFocus){
  clearUrls();
  view.innerHTML = state.screen==="home"?screenHome():state.screen==="album"?screenAlbum():screenHood();
  refreshMeter();
  const q=$("#q");
  if(q&&keepFocus){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
  if(state.screen==="album") paintAlbum(); else paintPhotos();
}

/* aplica/limpa a foto de um card conforme estado atual */
function applyPhotoToCard(card,id,blob){
  const img=card.querySelector('img.shot'), fb=card.querySelector('.fallback'), add=card.querySelector('.addphoto');
  const on=done.has(id);
  if(on && blob){
    const url=URL.createObjectURL(blob); liveUrls.push(url);
    img.src=url; img.hidden=false; img.dataset.photo=id;
    if(fb) fb.style.display='none';
    if(add) add.hidden=true;
  }else{
    img.hidden=true; img.removeAttribute('src'); delete img.dataset.photo;
    if(fb) fb.style.display='';
    if(add) add.hidden=!(on && !blob);
  }
}
async function paintPhotos(){
  const cards=[...view.querySelectorAll('.card[data-id]')];
  for(const card of cards){
    const id=card.dataset.id;
    let blob=null;
    if(done.has(id)){ try{ blob=await idbGet(id); }catch(_){}}
    applyPhotoToCard(card,id,blob);
  }
}
async function hydrateCard(id){
  const card=view.querySelector(`.card[data-id="${id}"]`);
  if(!card) return;
  let blob=null; if(done.has(id)){ try{ blob=await idbGet(id); }catch(_){}}
  applyPhotoToCard(card,id,blob);
}
async function paintAlbum(){
  const grid=$("#albumGrid"); if(!grid) return;
  let recs=[]; try{ recs=await idbAll(); }catch(_){}
  recs=recs.filter(r=>CAFES.some(c=>c.id===r.id));
  const keyOf = r => (meta[r.id]&&meta[r.id].d)?Date.parse(meta[r.id].d):(r.criadaEm||0);
  recs.sort((a,b)=>keyOf(a)-keyOf(b));
  const sub=$("#albumSub");
  if(sub) sub.textContent = recs.length? `${recs.length} foto${recs.length>1?'s':''} na nossa rota, em ordem de visita.` : "Ainda não tem fotos — marque uma visita e tire a primeira!";
  if(!recs.length){ grid.classList.remove("album"); grid.innerHTML=emptyHTML("O álbum começa na primeira foto. ☕"); return; }
  grid.classList.add("album");
  grid.innerHTML = recs.map(r=>{
    const c=CAFES.find(x=>x.id===r.id);
    const url=URL.createObjectURL(r.blob); liveUrls.push(url);
    const m=meta[r.id]||{}; const dt=m.d?fmtDate(m.d):"";
    return `<button class="tile" data-photo="${r.id}">
      <div class="tph"><img src="${url}" alt="Foto de ${esc(c.n)}"></div>
      <div class="tb"><b>${esc(c.n)}</b><span>${esc(c.b)}${dt?" · "+dt:""}</span></div>
    </button>`;
  }).join("");
}

/* atualiza a linha de data+nota do card sem re-render */
function updateCardMeta(card,id){
  const ml=card.querySelector('[data-metaline]');
  if(ml) ml.innerHTML = done.has(id)?metaLineHTML(id):"";
}
function updateHoodHead(){
  const list=CAFES.filter(c=>c.b===state.hood), d=list.filter(c=>done.has(c.id)).length;
  const p=view.querySelector(".hoodhead p");
  if(p) p.textContent=`${d} de ${list.length} já visitada${list.length>1?'s':''} ${d===list.length?"— bairro completo 🎉":""}`;
}

/* ================= eventos ================= */
document.addEventListener("click",e=>{
  const ph=e.target.closest("[data-photo]");
  if(ph){ openLightbox(ph.dataset.photo); return; }

  const add=e.target.closest("[data-add]");
  if(add){ currentTarget=add.dataset.add; $("#camIn").click(); return; }

  const rate=e.target.closest("[data-rate]");
  if(rate){ const [id,n]=rate.dataset.rate.split(":"); setRating(id,+n); return; }

  const hood=e.target.closest("[data-hood]");
  if(hood){ state.hood=hood.dataset.hood; state.screen="hood"; state.filter="todas"; state.q="";
            render(); window.scrollTo({top:0,behavior:"smooth"}); return; }

  if(e.target.closest("#back")){ state.screen="home"; render(); window.scrollTo({top:0,behavior:"instant"}); return; }

  const tab=e.target.closest("[data-f]");
  if(tab){ state.filter=tab.dataset.f; render(); return; }

  const chk=e.target.closest("[data-check]");
  if(chk){
    const id=chk.dataset.check, card=chk.closest(".card");
    if(done.has(id)){
      done.delete(id); save();
      card.classList.remove("done","pop"); chk.textContent="Marcar visita";
      updateCardMeta(card,id); hydrateCard(id); refreshMeter();
      if(state.screen==="hood") updateHoodHead();
    }else{
      done.add(id);
      if(!meta[id]) meta[id]={};
      if(!meta[id].d) meta[id].d=todayISO();
      save(); saveMeta();
      card.classList.add("done"); card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
      chk.textContent="✓ Visitado";
      updateCardMeta(card,id); hydrateCard(id);
      navigator.vibrate&&navigator.vibrate(18);
      refreshMeter(); celebrate(CAFES.find(x=>x.id===id));
      if(state.screen==="hood") updateHoodHead();
      currentTarget=id; $("#camIn").click();   // abre a câmera (opcional)
      if(state.screen==="hood"&&state.filter!=="todas") setTimeout(()=>render(),820);
    }
  }
});
document.addEventListener("input",e=>{ if(e.target.id==="q"){ state.q=e.target.value; render(true); } });

function setRating(id,n){
  meta[id]=meta[id]||{}; meta[id].r=n; saveMeta();
  view.querySelectorAll(`[data-stars="${id}"] button`).forEach((b,i)=>b.classList.toggle('on',i<n));
  if($("#lb").classList.contains("on")&&lbId===id) refreshLbCaption();
  toast(`Nota ${n}/5 salva ⭐`);
}

/* ================= câmera / fotos ================= */
$("#camIn").onchange=async e=>{
  const file=e.target.files&&e.target.files[0];
  e.target.value="";
  if(!file||!currentTarget) return;
  const id=currentTarget;
  try{
    toast("Salvando foto…");
    const blob=await compress(file);
    await idbPut(id,blob);
    ensurePersist();
    if(!done.has(id)){ done.add(id); save(); }
    meta[id]=meta[id]||{}; if(!meta[id].d) meta[id].d=todayISO(); saveMeta();
    refreshMeter();
    toast("Foto salva! 📸");
    if($("#lb").classList.contains("on")&&lbId===id){ openLightbox(id); }
    else if(state.screen==="album"){ paintAlbum(); }
    else{
      const card=view.querySelector(`.card[data-id="${id}"]`);
      if(card){ card.classList.add("done"); const btn=card.querySelector("[data-check]"); if(btn) btn.textContent="✓ Visitado"; updateCardMeta(card,id); }
      hydrateCard(id);
      if(state.screen==="hood") updateHoodHead();
    }
  }catch(err){ console.error(err); toast("Não consegui salvar a foto 😕"); }
};

/* ================= lightbox ================= */
function refreshLbCaption(){
  const c=CAFES.find(x=>x.id===lbId); if(!c) return;
  const m=meta[lbId]||{};
  $("#lbName").textContent=c.n;
  $("#lbMeta").textContent=(m.d?("Visitado em "+fmtDate(m.d)):"")+(m.r?("   ·   Nossa nota "+m.r+"/5 ⭐"):"");
}
async function openLightbox(id){
  const c=CAFES.find(x=>x.id===id); if(!c) return;
  lbId=id;
  let blob=null; try{ blob=await idbGet(id); }catch(_){}
  const img=$("#lbImg");
  if(lbUrl){ URL.revokeObjectURL(lbUrl); lbUrl=null; }
  if(blob){ lbUrl=URL.createObjectURL(blob); img.src=lbUrl; img.hidden=false; }
  else{ img.hidden=true; img.removeAttribute('src'); }
  refreshLbCaption();
  $("#lb").classList.add("on");
}
function closeLightbox(){
  $("#lb").classList.remove("on");
  if(lbUrl){ URL.revokeObjectURL(lbUrl); lbUrl=null; }
  lbId=null;
}
$("#lbClose").onclick=closeLightbox;
$("#lb").addEventListener("click",e=>{ if(e.target.id==="lb") closeLightbox(); });
$("#lbSwap").onclick=()=>{ if(lbId){ currentTarget=lbId; $("#camIn").click(); } };
$("#lbDel").onclick=async()=>{
  if(!lbId) return;
  if(!confirm("Apagar esta foto? A visita continua marcada.")) return;
  const id=lbId;
  try{ await idbDelete(id); }catch(_){}
  toast("Foto apagada.");
  closeLightbox();
  if(state.screen==="album") paintAlbum(); else hydrateCard(id);
};

/* ================= celebrações ================= */
let tTimer;
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on");
  clearTimeout(tTimer); tTimer=setTimeout(()=>el.classList.remove("on"),2600); }
function celebrate(c){
  const list=CAFES.filter(x=>x.b===c.b);
  if(list.every(x=>done.has(x.id))) toast(`🎉 ${c.b} completo!`);
  else if(done.size===CAFES.length) toast("🏆 Rota do Café concluída!");
  else if(done.size%10===0) toast(`☕ ${done.size} cafeterias já!`);
}

/* ================= álbum / navegação ================= */
$("#btnAlbum").onclick=()=>{ state.screen="album"; state.q=""; render(); window.scrollTo({top:0,behavior:"smooth"}); };

/* ================= backup completo (fotos + progresso) ================= */
$("#btnBackup").onclick=async()=>{
  try{
    toast("Preparando backup…");
    let recs=[]; try{ recs=await idbAll(); }catch(_){}
    const fotos={};
    for(const r of recs){ if(CAFES.some(c=>c.id===r.id)) fotos[r.id]=await blobToDataURL(r.blob); }
    const data={ app:"rota-cafe", v:2, exportadoEm:new Date().toISOString(), done:[...done], meta, fotos };
    const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`rota-cafe-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast("Backup baixado 💾");
  }catch(err){ console.error(err); toast("Não consegui gerar o backup 😕"); }
};
$("#btnRestore").onclick=()=>$("#backIn").click();
$("#backIn").onchange=async e=>{
  const file=e.target.files&&e.target.files[0]; e.target.value="";
  if(!file) return;
  try{
    const data=JSON.parse(await file.text());
    if(Array.isArray(data.done)) data.done.forEach(id=>{ if(CAFES.some(c=>c.id===id)) done.add(id); });
    if(data.meta&&typeof data.meta==="object"){
      for(const id in data.meta){ if(CAFES.some(c=>c.id===id)) meta[id]={...(meta[id]||{}),...data.meta[id]}; }
    }
    if(data.fotos&&typeof data.fotos==="object"){
      for(const id in data.fotos){
        if(!CAFES.some(c=>c.id===id)) continue;
        try{ const blob=await dataURLToBlob(data.fotos[id]); const cr=meta[id]&&meta[id].d?Date.parse(meta[id].d):Date.now(); await idbPut(id,blob,cr); }catch(_){}
      }
    }
    save(); saveMeta(); render(); toast("Backup restaurado! ☕");
  }catch(err){ console.error(err); toast("Arquivo de backup inválido 😕"); }
};

/* ================= progresso em texto (compartilhar com o casal) ================= */
$("#btnExp").onclick=async()=>{
  const code=btoa(JSON.stringify([...done]));
  try{ await navigator.clipboard.writeText(code); toast("Código copiado — manda pra ela!"); }
  catch{ prompt("Copie seu código de progresso:",code); }
};
$("#btnImp").onclick=()=>{
  const v=prompt("Cole aqui o código de progresso:");
  if(!v) return;
  try{ const arr=JSON.parse(atob(v.trim()));
       if(!Array.isArray(arr)) throw 0;
       arr.forEach(id=>{ if(CAFES.some(c=>c.id===id)) done.add(id); });
       save(); render(); toast("Progressos juntados! ☕"); }
  catch{ toast("Código inválido 😕"); }
};
$("#btnReset").onclick=()=>{
  if(confirm("Zerar todas as marcações e notas? As fotos continuam salvas.")){
    done=new Set(); meta={}; save(); saveMeta(); render(); toast("Rota zerada.");
  }
};

/* barra fixa + sorteio */
addEventListener("scroll",()=>{ $("#mini").classList.toggle("on", scrollY>210); },{passive:true});
$("#btnLuck").onclick=()=>{
  const falta=CAFES.filter(c=>!done.has(c.id));
  if(!falta.length){ toast("Vocês já foram em todas! 🏆"); return; }
  const c=falta[Math.floor(Math.random()*falta.length)];
  state.screen="hood"; state.hood=c.b; state.filter="todas"; state.q=""; render();
  window.scrollTo({top:0,behavior:"instant"});
  toast(`Que tal ${c.n}? (${c.b})`);
  setTimeout(()=>{
    const el=view.querySelector(`.card[data-id="${c.id}"]`);
    if(el){ el.scrollIntoView({behavior:"smooth",block:"center"});
            el.animate([{outline:"0 solid transparent"},{outline:"4px solid #E39B34"},
                        {outline:"0 solid transparent"}],{duration:1500}); }
  },260);
};

try{ render(); }
catch(err){
  view.innerHTML='<div class="empty"><div>⚠️</div>Algo falhou ao carregar: '+err.message+'</div>';
  console.error(err);
}
ensurePersist();
</script>
